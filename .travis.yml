os: linux
language: python
addons:
  apt:
    packages:
      - lua5.2
      - liblua5.2-dev
cache: pip
install:
  - export PKG_CONFIG_PATH="$(python-config --prefix)/lib/pkgconfig:$PKG_CONFIG_PATH"
  - echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH"
  # The above two statements can be removed when/if https://github.com/travis-ci/travis-ci/issues/8217 is fixed
  - pip install -U pip tox
matrix:
  include:
    - stage: build
      name: "Functional Tests"
      language: shell
      dist: jammy
      addons:
        apt:
          # Upgrade Docker to the latest (see https://docs.travis-ci.com/user/docker/)
          sources:
            - docker-jammy
          packages:
            - docker-ce
      services:
        - docker
      install:
        - docker --version
        - docker-compose --version
      script:
        - ./functional.sh verbose
    - stage: build
      name: "Unit Tests: Python 3.8 with Attrs 18 to 22"
      python: "3.8"
      script:
        - tox -e py38-attrs18,py38-attrs19,py38-attrs20,py38-attrs21,py38-attrs22,py38-flake8,py38-mypy
    - stage: build
      name: "Unit Tests: Python 3.9 with Pytest 5.1 and 8.0"
      python: "3.9"
      script:
        - tox -e py39-pytest51,py39-pytest80,py39-flake8,py39-mypy
    - stage: build
      name: "Unit Tests: Python 3.10 with Currint 1.6 and 2.0"
      python: "3.10"
      script:
        - tox -e py310-currint16,py310-currint20,py310-flake8,py310-mypy
    - stage: build
      name: "Unit Tests: Python 3.11"
      python: "3.11"
      script:
        - tox -e py311-flake8,py311-mypy
    - stage: build
      name: "Unit Tests: Python 3.12"
      python: "3.12"
      script:
        - tox -e py312-flake8,py312-mypy
    - stage: deploy
      python: "3.12"
      script: skip
      install:
        - pip install -U pip setuptools pyopenssl
      deploy:
        provider: pypi
        username: eventbrite
        password:
          secure: 
        distributions: "sdist bdist_wheel"
        on:
          tags: true
stages:
  - build
  - name: deploy
    if: tag =~ ^[0-9]+\.[0-9]+\.[0-9]+
