[tox]
envlist =
    py312
    coverage

[testenv]
usedevelop=True
deps =
    .[testing]
    setuptools>=65,<70
    setuptools_scm>=7.1,<8
    pytest>=7.2,<8.0
    pytest-asyncio>=0.21.0,<0.24
    lupa>=2.0
    attrs18: attrs~=18.2
    attrs19: attrs~=19.1
    attrs20: attrs~=20.3
    attrs21: attrs~=21.3
    pyinotify: pyinotify~=0.9
    currint16: currint~=1.6
    currint20: currint~=2.0
    pytest46: pytest~=4.6.9
    pytest51: pytest~=5.1.3
    pytest53: pytest~=5.3.5
#    ipdb
commands =
#    conformity_branch: pip uninstall -y conformity
#    conformity_branch: pip install git+https://github.com/eventbrite/conformity.git@insert_branch_name_here
    coverage run --parallel-mode -m pytest tests/unit tests/integration

[testenv:py37-pytest51]
commands =
    coverage run --parallel-mode -m pytest tests/unit tests/integration
    ./lint.sh --no-flake --no-mypy

[testenv:py27-flake8]
skip_install = true
deps = flake8~=3.7,>=3.7.8
commands = flake8

[testenv:py37-flake8]
skip_install = true
deps = flake8~=5.0
commands = flake8

[testenv:coverage]
deps = 
    .[testing]
    lupa>=2.0
commands =
    coverage run -m pytest tests/unit tests/integration
    coverage report --show-missing
