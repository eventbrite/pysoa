[tox]
envlist =
    py{38,39,310,311,312}
    py38-currint{16,20}
    py38-attrs{18,19,20,21,22}
    py{38,39,310,311,312}-pytest{46,51,53,80}
    py{38,39,310,311,312}-flake8
    coverage
    py{38,39,310,311,312}-mypy

[testenv]
usedevelop=True
deps =
    .[testing]
    attrs18: attrs~=18.2
    attrs19: attrs~=19.1
    attrs20: attrs~=20.3
    attrs21: attrs~=21.3
    attrs22: attrs~=22.1
    currint16: currint~=1.6
    currint20: currint~=2.0
    pytest46: pytest~=4.6.9
    pytest51: pytest~=5.1.3
    pytest53: pytest~=5.3.5
    pytest80: pytest~=8.0.0
commands =
    coverage run --parallel-mode -m pytest tests/unit tests/integration

[testenv:py38-pytest51]
commands =
    coverage run --parallel-mode -m pytest tests/unit tests/integration
    ./lint.sh --no-flake --no-mypy

[testenv:py38-flake8]
skip_install = true
deps = flake8~=5.0
commands = flake8

[testenv:py39-flake8]
skip_install = true
deps = flake8~=5.0
commands = flake8

[testenv:py310-flake8]
skip_install = true
deps = flake8~=5.0
commands = flake8

[testenv:py311-flake8]
skip_install = true
deps = flake8~=5.0
commands = flake8

[testenv:py312-flake8]
skip_install = true
deps = flake8~=5.0
commands = flake8

[testenv:coverage]
skip_install = true
deps = coverage~=7.4.0
commands =
    coverage combine
    coverage report

[testenv:py38-mypy]
commands =
    mypy . --exclude 'tests/.*/setup\.py$' --exclude 'build'

[testenv:py39-mypy]
commands =
    mypy . --exclude 'tests/.*/setup\.py$' --exclude 'build'

[testenv:py310-mypy]
commands =
    mypy . --exclude 'tests/.*/setup\.py$' --exclude 'build'

[testenv:py311-mypy]
commands =
    mypy . --exclude 'tests/.*/setup\.py$' --exclude 'build'

[testenv:py312-mypy]
commands =
    mypy . --exclude 'tests/.*/setup\.py$' --exclude 'build'
